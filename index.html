<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff6b35" />
  <title>今天吃什麼？</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
</head>
<body>
  <header class="app-header">
    <h1>🍽️ 今天吃什麼？</h1>
    <p class="subtitle">找找你附近有什麼好吃的</p>
  </header>

  <main class="app-main">
    <section class="controls">
      <div class="location-row">
        <button id="locate-btn" class="btn btn-primary">
          <span class="btn-icon">📍</span>
          <span id="locate-label">使用我的位置</span>
        </button>
        <div class="radius-control">
          <label for="radius">搜尋半徑</label>
          <select id="radius">
            <option value="500">500 m</option>
            <option value="1000" selected>1 km</option>
            <option value="2000">2 km</option>
            <option value="3000">3 km</option>
            <option value="5000">5 km</option>
          </select>
        </div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="filters" aria-label="料理類型篩選">
      <div class="filter-header">
        <h2>料理類型</h2>
        <div class="filter-actions">
          <button id="filter-all" class="link-btn" type="button">全部</button>
          <button id="filter-none" class="link-btn" type="button">清除</button>
        </div>
      </div>
      <div id="filter-chips" class="chips"></div>
    </section>

    <section class="result-actions">
      <button id="random-btn" class="btn btn-accent" disabled>
        <span class="btn-icon">🎲</span>隨機抽一間
      </button>
      <div id="result-count" class="result-count"></div>
    </section>

    <section id="pick-card" class="pick-card hidden" aria-live="polite"></section>

    <section class="results">
      <ul id="restaurant-list" class="restaurant-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <p>🤔 這個範圍內沒有符合條件的餐廳，<br/>試試放寬篩選或擴大搜尋半徑。</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>資料與照片 © <a href="https://developers.google.com/maps" target="_blank" rel="noopener">Google Maps Platform</a></p>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
